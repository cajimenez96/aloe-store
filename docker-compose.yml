# Entorno de desarrollo local: solo PostgreSQL y Redis (arquitectura.md, seccion 20.2).
# Backend y storefront corren en la maquina con `npm run dev`.
# Los puertos se publican unicamente en 127.0.0.1 (seguridad.md, SEC-04).
# Para cambiar los puertos del host, crear un archivo .env junto a este archivo
# con POSTGRES_PORT y REDIS_PORT.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: medusa_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
