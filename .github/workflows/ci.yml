name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloe/backend lint
      # Sin pruebas todavía: --passWithNoTests se quita cuando exista la primera.
      - run: pnpm --filter @aloe/backend run test:unit --passWithNoTests
      - run: pnpm --filter @aloe/backend build

  storefront:
    runs-on: ubuntu-latest
    env:
      # Valores de relleno: el build no consulta el backend.
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9100
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
      NEXT_PUBLIC_IMAGES_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aloe/storefront lint
      # next build también verifica los tipos.
      - run: pnpm --filter @aloe/storefront build

  # Una vulnerabilidad crítica bloquea el merge (seguridad.md, SEC-80).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --audit-level=critical

  # Al integrar en main se construyen las imágenes de producción (sin publicarlas).
  docker-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, storefront, audit]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, storefront]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          push: false
          tags: aloe-${{ matrix.app }}:${{ github.sha }}
